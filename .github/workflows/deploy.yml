# push 到 main 就自動 build 並部署到 Cloudflare Pages（正式站）
# 其他分支 push 會部署成預覽網址：https://<分支名>.mewtelligence.pages.dev
name: Deploy to Cloudflare Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy
        run: npx wrangler pages deploy dist --project-name=mewtelligence --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 985340d14c773b09c6b30d379d719eb8
